    <form id="encodeForm">
    <label for="textInput">Enter text:</label><br><br>
    <input type="text" id="textInput" name="textInput" size="10">
    <button class="button2" type="submit">Encode</button>
    </form>

    <p>Encoded Result:</p>
    <p id="result"></p>

    <script>
    function scrambleText(text) {

      const chars = text.split('');

      for (let i = chars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }
      return chars.join('');
    }

    document.getElementById("encodeForm").addEventListener("submit", function(event) {
      event.preventDefault(); 
      
      const inputText = document.getElementById("textInput").value;
      const scrambled = scrambleText(inputText);
      
      document.getElementById("result").textContent = scrambled;
    });
  </script>
